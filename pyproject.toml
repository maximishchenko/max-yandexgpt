[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "max-yandexgpt"
version = "0.1.0"
description = "Python framework for building Max messenger bots powered by YandexGPT"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "Nikolai Nabiev", email = "niko-rech@yandex.ru"},
]
keywords = ["max", "messenger", "yandexgpt", "bot", "ai", "chatbot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "maxapi>=0.1.0",
    "openai>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/nabinabi11/max-yandexgpt"
Repository = "https://github.com/nabinabi11/max-yandexgpt"
"Repository (GitVerse)" = "https://gitverse.ru/nikolainabiev/max-yandexgpt"
Issues = "https://github.com/nabinabi11/max-yandexgpt/issues"

[tool.setuptools.packages.find]
include = ["max_yandexgpt*"]

[dependency-groups]
dev = [
    "commitizen>=4.19.1",
    "coverage>=7.16.2",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]



[tool.ruff]
fix = false

exclude = [
    '.git',
    '.venv',
    '__pycache__',
    '.ruff_cache',
    '.mypy_cache',
    '__version__.py'
]

select = [
    "E",
    "F",
    "I",
    "UP",
    "N",
    "B",
    "D",
    "C4",
    "RUF",
]

ignore = [
    "C408",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF100",
    "S110",
    "D203",
    "D212",
    "D213",
]

line-length = 79
target-version = "py311"

[tool.ruff.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true
platform = "win32"
python_version = "3.11"


explicit_package_bases = true
namespace_packages = true

exclude = [
    '.venv',
    'tests/',
]

[tool.pyright]
reportPrivateUsage = false
include = ["max_yandexgpt"]
exclude = [
    "**/__pycache__",
    ".git",
    ".venv",
]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
link-mode = "copy"

[tool.coverage.run]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.commitizen]
version = "0.0.1"
tag_format = "v$version"
update_changelog_on_bump = true
version_files = [
    "__version__.py:__version__ = \"$version\"",
]
